<!DOCTYPE html>
<html>
<head>
    <title>Electron Note App</title>
    <style>
        .task-row{
            display:flex;
            gap:6px;
            margin-bottom:6px;
            align-items:center;
        } 

        .task-input{
            flex:1;
            min-width:0;
            background:black;
            color:white;
        }
        
        .task-input[type = "button"]{
            flex:1;
            min-width:0;
            max-width:65px;
            background:black;
            color:white;
        }

        body {
            margin: 0;
            font-family: Arial;
            background: #111;
            color: white;
        }

        /* overall layout */
        #app {
            display: flex;
            height: 100vh;
        }

        /* LEFT SIDEBAR */
        #sidebar {
            max-width: 70px;
            background: #1e1e1e;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            
        }

        /* buttons */
        #sidebar button {
            padding: 5px;
            cursor: pointer;
        }

        /* MAIN CONTENT */
        #main {
            flex: 1;

            padding: 20px;

            display:flex;
            flex-direction:column;

            overflow:auto;
        }

        /* VIEW AREA */
        #view {
            flex:1;

            background: #222;
            padding: 20px;
            border-radius: 8px;

            overflow:auto;
        }
    </style>
</head>

<body style="background:black; color:white;">

<div id="app">

    <!-- LEFT PANEL -->
    <div id="sidebar">
        <h3>Menu</h3>

        <button onclick="showNotes()">Notes</button>
        <button onclick="showChecklist()">Checklist</button>
        <button onclick="showCalendar()";>Calendar</button>
    </div>

    <!-- MAIN AREA -->
    <div id="main">
        <div id="view">
            <h2>Welcome</h2>
            <p>Select a section</p>
        </div>
    </div>

</div>

<script src="renderer.js"></script>

</body>
</html>
